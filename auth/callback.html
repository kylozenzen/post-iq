<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>PostIQ — Connecting Buffer</title>
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bricolage+Grotesque:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg:#0f1020; --card:#17182b; --border:rgba(255,255,255,.12); --text:#f8fafc; --muted:#a5adbd; --brand:#8b5cf6; --green:#22c55e; --red:#ef4444; --amber:#f59e0b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 20% 20%, rgba(139,92,246,.24), transparent 28%), radial-gradient(circle at 80% 10%, rgba(34,197,94,.14), transparent 24%), var(--bg); color:var(--text); font-family:"Bricolage Grotesque", system-ui, sans-serif; }
    .card { width:min(100%, 480px); padding:30px; border:1px solid var(--border); border-radius:22px; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.025)), var(--card); box-shadow:0 28px 80px rgba(0,0,0,.35); text-align:center; }
    .brand { display:inline-flex; align-items:center; gap:8px; margin-bottom:22px; padding:8px 12px; border:1px solid var(--border); border-radius:999px; font-weight:800; letter-spacing:.01em; }
    .badge { color:var(--brand); font:500 11px/1 "DM Mono", monospace; text-transform:uppercase; }
    .icon { width:58px; height:58px; border-radius:18px; display:grid; place-items:center; margin:0 auto 18px; font-size:28px; background:rgba(139,92,246,.16); border:1px solid rgba(139,92,246,.28); }
    .spinner { width:30px; height:30px; border-radius:50%; border:3px solid rgba(255,255,255,.2); border-top-color:var(--brand); animation:spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin:0 0 8px; font-size:28px; line-height:1.05; }
    p { margin:0; color:var(--muted); line-height:1.55; font-size:15px; }
    .detail { margin-top:16px; padding:12px; border-radius:12px; background:rgba(255,255,255,.045); color:var(--muted); font:12px/1.5 "DM Mono", monospace; overflow-wrap:anywhere; display:none; }
    .actions { margin-top:22px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    a, button { border:0; border-radius:12px; padding:10px 14px; background:var(--brand); color:white; font:700 13px/1 "Bricolage Grotesque", sans-serif; text-decoration:none; cursor:pointer; }
    .ghost { background:rgba(255,255,255,.08); color:var(--text); border:1px solid var(--border); }
    .success .icon { background:rgba(34,197,94,.15); border-color:rgba(34,197,94,.3); }
    .error .icon { background:rgba(239,68,68,.14); border-color:rgba(239,68,68,.3); }
    .cancelled .icon { background:rgba(245,158,11,.14); border-color:rgba(245,158,11,.3); }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="brand">PostIQ <span class="badge">Buffer</span></div>
    <div class="icon" id="icon"><div class="spinner" aria-hidden="true"></div></div>
    <h1 id="title">Connecting Buffer…</h1>
    <p id="message">Finishing the secure OAuth handshake. This should only take a moment.</p>
    <div class="detail" id="detail"></div>
    <div class="actions" id="actions" style="display:none;"></div>
  </main>

  <script>
    const BUFFER_CLIENT_ID = "ijzu75qv_CAcO0qMelb93HjOVh1EwEanezilfgBiOEG";
    const APP_URL = '/app.html';

    const qs = id => document.getElementById(id);

    function setScreen(kind, title, message, detailText = '') {
      const card = qs('card');
      card.className = `card ${kind || ''}`.trim();
      qs('icon').innerHTML = kind === 'success' ? '✓' : kind === 'cancelled' ? '↩' : kind === 'error' ? '!' : '<div class="spinner" aria-hidden="true"></div>';
      qs('title').textContent = title;
      qs('message').textContent = message;
      const detail = qs('detail');
      detail.style.display = detailText ? 'block' : 'none';
      detail.textContent = detailText;
    }

    function showActions(primaryText = 'Return to PostIQ') {
      const actions = qs('actions');
      actions.style.display = 'flex';
      actions.innerHTML = `<a href="${APP_URL}">${primaryText}</a><button class="ghost" type="button" id="startOverBtn">Start over</button>`;
      qs('startOverBtn')?.addEventListener('click', () => {
        ['postiq_oauth_state', 'postiq_pkce_verifier', 'postiq_oauth_redirect_uri'].forEach(key => sessionStorage.removeItem(key));
        location.href = APP_URL;
      });
    }

    function yesNo(value) {
      return value ? 'yes' : 'no';
    }

    function buildOAuthTechnicalDetails({ error, errorDescription, iss, state, storedState, verifier, code }) {
      return [
        `error: ${error || 'none'}`,
        `error_description: ${errorDescription || 'none'}`,
        `iss: ${iss || 'none'}`,
        `returned state present: ${yesNo(state)}`,
        `stored state present: ${yesNo(storedState)}`,
        `stored verifier present: ${yesNo(verifier)}`,
        `code present: ${yesNo(code)}`,
        `current origin: ${location.origin}`,
      ].join('\n');
    }

    async function exchangeCodeForTokens(code, redirectUri, verifier) {
      const body = new URLSearchParams({
        client_id: BUFFER_CLIENT_ID,
        grant_type: 'authorization_code',
        code,
        redirect_uri: redirectUri,
        code_verifier: verifier,
      });

      // PostIQ is a static browser app and therefore a public OAuth client.
      // PKCE proves this browser still has the original verifier without exposing a client secret.
      // Client secrets should never be used in browser code because users can view the source.
      const response = await fetch('https://auth.buffer.com/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString(),
      });

      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error_description || payload.error || `Token exchange failed (${response.status})`);
      }
      return payload;
    }

    function storeTokenField(key, value) {
      sessionStorage.removeItem(key);
      if (value === undefined || value === null || value === '') {
        localStorage.removeItem(key);
        return;
      }
      localStorage.setItem(key, String(value));
    }

    function storeTokens(tokenResponse) {
      const expiresIn = Number(tokenResponse.expires_in || 0);
      const scope = Array.isArray(tokenResponse.scope) ? tokenResponse.scope.join(' ') : (tokenResponse.scope || '');
      storeTokenField('postiq_buffer_access_token', tokenResponse.access_token || '');
      storeTokenField('postiq_buffer_refresh_token', tokenResponse.refresh_token || '');
      storeTokenField('postiq_buffer_token_type', tokenResponse.token_type || 'Bearer');
      storeTokenField('postiq_buffer_token_scope', scope);
      storeTokenField('postiq_buffer_token_expires_at', expiresIn ? String(Date.now() + expiresIn * 1000) : '');
      localStorage.removeItem('postiq_buffer_reconnect_needed');
      sessionStorage.removeItem('postiq_buffer_reconnect_needed');
    }

    async function handleCallback() {
      const params = new URLSearchParams(location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      const errorDescription = params.get('error_description');
      const iss = params.get('iss');
      const storedState = sessionStorage.getItem('postiq_oauth_state');
      const verifier = sessionStorage.getItem('postiq_pkce_verifier');
      const redirectUri = sessionStorage.getItem('postiq_oauth_redirect_uri');
      const technicalDetails = buildOAuthTechnicalDetails({ error, errorDescription, iss, state, storedState, verifier, code });

      if (error === 'access_denied') {
        setScreen('cancelled', 'Connection cancelled', 'Buffer did not authorize the connection. If you never saw an approval screen, the authorization request may need adjustment.', technicalDetails);
        showActions('Back to PostIQ');
        return;
      }
      if (error) {
        setScreen('error', 'Buffer connection failed', errorDescription || error, technicalDetails);
        showActions('Back to PostIQ');
        return;
      }

      // `state` protects against CSRF. The callback must match the value generated before redirecting to Buffer.
      if (!state || !storedState || state !== storedState) {
        setScreen('error', 'Security check failed', 'The OAuth state was missing or invalid, so PostIQ stopped the connection for your safety.', technicalDetails);
        showActions('Try again');
        return;
      }
      if (!code) {
        setScreen('error', 'Missing authorization code', 'Buffer did not return the code PostIQ needs to finish connecting.', technicalDetails);
        showActions('Try again');
        return;
      }
      if (!verifier || !redirectUri) {
        setScreen('error', 'Session expired', 'The saved PKCE verifier or redirect URL is missing. Please start the Buffer connection again.', technicalDetails);
        showActions('Try again');
        return;
      }

      try {
        const tokenResponse = await exchangeCodeForTokens(code, redirectUri, verifier);
        storeTokens(tokenResponse);
        sessionStorage.removeItem('postiq_oauth_state');
        sessionStorage.removeItem('postiq_pkce_verifier');
        sessionStorage.removeItem('postiq_oauth_redirect_uri');
        setScreen('success', 'Buffer connected', 'Redirecting you back to PostIQ…');
        setTimeout(() => { location.href = `${APP_URL}?connected=buffer`; }, 700);
      } catch (err) {
        setScreen('error', 'Could not finish connecting', err.message || 'The token exchange failed. Please try again.', `${technicalDetails}\ntoken exchange error: ${err.message || 'unknown'}`);
        showActions('Try again');
      }
    }

    handleCallback();
  </script>
</body>
</html>
