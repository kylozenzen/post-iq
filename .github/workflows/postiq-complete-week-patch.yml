name: Apply Complete Week planner patch

on:
  push:
    branches:
      - agent/show-published-posts-in-planning

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/show-published-posts-in-planning
          fetch-depth: 0

      - name: Apply planner patch
        run: python .github/scripts/apply_complete_week.py

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css app.html README.md
          git commit -m "show published posts in planning"
          git push origin HEAD:agent/show-published-posts-in-planning
