name: Apply Complete Week planner patch

on:
  push:
    branches:
      - agent/show-published-posts-in-planning

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/show-published-posts-in-planning
          fetch-depth: 0

      - name: Patch planner to include published posts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, repl, label, flags=0):
              text, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, found {count}')
              return text

          app = Path('app.js')
          js = app.read_text()

          js = replace_once(
              js,
              "  scheduled: [],\n  month: new Date(),",
              "  scheduled: [],\n  published: [],\n  month: new Date(),",
              'state published collection'
          )

          js = replace_once(
              js,
              "  scheduled: { value: [], ts: 0 },\n};\nconst CACHE_TTL = { orgId: 86400000, channels: 86400000, scheduled: 600000 };",
              "  scheduled: { value: [], ts: 0 },\n  published: { value: [], ts: 0 },\n};\nconst CACHE_TTL = { orgId: 86400000, channels: 86400000, scheduled: 600000, published: 600000 };",
              'published cache'
          )

          js = replace_once(
              js,
              "const fmtDate = d => d.toISOString().slice(0, 10);",
              "const fmtDate = value => {\n  const d = value instanceof Date ? value : new Date(value);\n  if (Number.isNaN(d.getTime())) return '';\n  const y = d.getFullYear();\n  const m = String(d.getMonth() + 1).padStart(2, '0');\n  const day = String(d.getDate()).padStart(2, '0');\n  return `${y}-${m}-${day}`;\n};",
              'local calendar date helper'
          )

          js = replace_once(
              js,
              "  if (Array.isArray(cache.scheduled.value) && cache.scheduled.value.length) state.scheduled = cache.scheduled.value;\n}",
              "  if (Array.isArray(cache.scheduled.value) && cache.scheduled.value.length) state.scheduled = cache.scheduled.value;\n  if (Array.isArray(cache.published.value)) state.published = cache.published.value;\n}",
              'hydrate published cache'
          )

          js = replace_once(
              js,
              "  state.channels = []; state.scheduled = []; state.organizationId = null;",
              "  state.channels = []; state.scheduled = []; state.published = []; state.organizationId = null;",
              'clear published data'
          )

          bounds_block = """function getScheduledBounds() {
  const m = state.month;
  const start = new Date(m.getFullYear(), m.getMonth(), 1); start.setDate(start.getDate() - 7);
  const end = new Date(m.getFullYear(), m.getMonth() + 1, 0); end.setDate(end.getDate() + 60);
  return { start, end };
}
"""
          complete_week_helpers = bounds_block + """
function isPublishedPost(post) {
  return ['sent', 'published'].includes(String(post?.status || '').toLowerCase());
}

function getPostPlanningAt(post) {
  return isPublishedPost(post)
    ? (post?.sentAt || post?.publishedAt || post?.dueAt || post?.createdAt || null)
    : (post?.dueAt || post?.scheduledAt || post?.createdAt || null);
}

function getPlannerPosts() {
  const byId = new Map();
  [...(state.published || []), ...(state.scheduled || [])].forEach((post, index) => {
    if (!post) return;
    const fallback = `${getPostPlanningAt(post) || ''}|${post.channelId || ''}|${post.text || ''}|${index}`;
    const key = String(post.id || fallback);
    const existing = byId.get(key);
    if (!existing || (!isPublishedPost(existing) && isPublishedPost(post))) byId.set(key, post);
  });
  return [...byId.values()].sort((a, b) => new Date(getPostPlanningAt(a) || 0) - new Date(getPostPlanningAt(b) || 0));
}

function postsForDateKey(dateKey) {
  return getPlannerPosts().filter(post => fmtDate(getPostPlanningAt(post)) === dateKey);
}

function plannerDaySummary(posts = []) {
  const published = posts.filter(isPublishedPost).length;
  const scheduled = posts.length - published;
  const parts = [];
  if (published) parts.push(`${published} published`);
  if (scheduled) parts.push(`${scheduled} scheduled`);
  return parts.join(' · ') || 'Open day';
}

async function getPublishedPosts({ force = false } = {}) {
  if (!force && isCacheFresh('published')) return state.published || [];
  const orgId = await getOrgId({ force });
  if (!orgId) return [];
  const bounds = getScheduledBounds();
  let all = [], after = null, hasNext = true, fetched = 0;
  const seen = new Set();
  const q = 'query SentPosts($organizationId: OrganizationId!, $after: String, $first: Int!) { posts(first:$first,after:$after,input:{organizationId:$organizationId,filter:{status:[sent]},sort:[{field:createdAt,direction:desc}]}){edges{node{id text createdAt sentAt channelId externalLink assets{thumbnail mimeType source}}} pageInfo{hasNextPage endCursor}} }';
  while (hasNext && fetched < 500) {
    const page = await callBuffer(q, { organizationId: orgId, after, first: 100 });
    const block = page?.data?.posts;
    const edges = block?.edges || [];
    edges.forEach(edge => {
      const post = edge?.node;
      if (!post?.id || seen.has(post.id)) return;
      const sentAt = post.sentAt || post.createdAt;
      const sent = new Date(sentAt || 0);
      if (!Number.isNaN(sent.getTime()) && sent >= bounds.start && sent <= bounds.end) {
        seen.add(post.id);
        all.push({ ...post, dueAt: sentAt, status: 'sent' });
      }
    });
    fetched += edges.length;
    hasNext = !!block?.pageInfo?.hasNextPage;
    after = block?.pageInfo?.endCursor || null;
    if (!block?.pageInfo || !edges.length) break;
    const oldest = edges[edges.length - 1]?.node;
    const oldestAt = new Date(oldest?.sentAt || oldest?.createdAt || 0);
    if (!Number.isNaN(oldestAt.getTime()) && oldestAt < bounds.start) break;
  }
  all.sort((a, b) => new Date(getPostPlanningAt(a) || 0) - new Date(getPostPlanningAt(b) || 0));
  state.published = all;
  cache.published = { value: all, ts: Date.now() };
  saveCacheState();
  return all;
}
"""
          js = replace_once(js, bounds_block, complete_week_helpers, 'planner helpers and published fetch')

          js = replace_once(
              js,
              "    const posts = await getScheduledPosts({ force });",
              "    const [scheduledPosts, publishedPosts] = await Promise.all([\n      getScheduledPosts({ force }),\n      getPublishedPosts({ force })\n    ]);\n    const plannerPosts = getPlannerPosts();",
              'sync published posts'
          )
          js = replace_once(js, "    setSyncStatus('success', `${posts.length} scheduled posts loaded.`);", "    setSyncStatus('success', `${scheduledPosts.length} scheduled · ${publishedPosts.length} published.`);", 'sync status')
          js = replace_once(js, "    showToast(`Loaded ${posts.length} posts`, 'success');", "    showToast(`Loaded ${plannerPosts.length} planner posts`, 'success');", 'sync toast')
          js = replace_once(js, "    safeTrack(() => GA4_Auth.syncComplete({ postCount: posts.length, channelCount: state.channels.length, syncTimeMs: Date.now() - syncStartTime, usedCache: false }));", "    safeTrack(() => GA4_Auth.syncComplete({ postCount: plannerPosts.length, channelCount: state.channels.length, syncTimeMs: Date.now() - syncStartTime, usedCache: false }));", 'sync analytics')

          old_pill = """function calendarPostPillHtml(post, dataAttribute, dateKey, limit) {
  const platform = platformIdentity(post);
  return `<button type=\"button\" class=\"day-post-pill\" ${dataAttribute}=\"${safeText(dateKey)}\" title=\"${safeText(platform.label)} · ${safeText(compact(post.text, 120))}\">${platformLogoHtml(post)}<span class=\"day-post-copy\">${safeText(compact(post.text, limit))}</span></button>`;
}
function snapshotPostPayload(p) {
  return {
    dueAt: p.dueAt, text: p.text || '', status: p.status || 'scheduled',
    channelName: postChannelLabel(p), platform: postPlatformLabel(p), channelId: p.channelId || '',
    mediaUrls: getPostMediaUrls(p)
  };
}
"""
          new_pill = """function calendarPostPillHtml(post, dataAttribute, dateKey, limit) {
  const platform = platformIdentity(post);
  const published = isPublishedPost(post);
  const statusLabel = published ? 'Published' : 'Scheduled';
  return `<button type=\"button\" class=\"day-post-pill${published ? ' is-published' : ''}\" ${dataAttribute}=\"${safeText(dateKey)}\" title=\"${safeText(statusLabel)} · ${safeText(platform.label)} · ${safeText(compact(post.text, 120))}\">${platformLogoHtml(post)}<span class=\"day-post-status\" aria-hidden=\"true\">${published ? '✓' : '◷'}</span><span class=\"day-post-copy\">${safeText(compact(post.text, limit))}</span></button>`;
}
function snapshotPostPayload(p) {
  const planningAt = getPostPlanningAt(p);
  return {
    dueAt: planningAt, dateKey: fmtDate(planningAt), sentAt: p.sentAt || null, externalLink: p.externalLink || '',
    text: p.text || '', status: isPublishedPost(p) ? 'sent' : 'scheduled',
    channelName: postChannelLabel(p), platform: postPlatformLabel(p), channelId: p.channelId || '',
    mediaUrls: getPostMediaUrls(p)
  };
}
"""
          js = replace_once(js, old_pill, new_pill, 'calendar post status pills')

          calendar_matches = js.count("state.scheduled.filter(p => fmtDate(new Date(p.dueAt)) === key)")
          if calendar_matches < 4:
              raise SystemExit(f'planner day post lookup: expected at least 4 matches, found {calendar_matches}')
          js = js.replace("state.scheduled.filter(p => fmtDate(new Date(p.dueAt)) === key)", "postsForDateKey(key)")

          js = replace_once(
              js,
              "${dayPosts.length ? `${dayPosts.length} post${dayPosts.length === 1 ? '' : 's'}` : 'Open day'}",
              "${dayPosts.length ? plannerDaySummary(dayPosts) : 'Open day'}",
              'week status summary'
          )

          js = replace_once(
              js,
              "  qs('dayPostPreview').innerHTML = `<div style=\"font-size:12px;color:var(--subtle);margin-bottom:8px;\">${dayPosts.length} scheduled post${dayPosts.length === 1 ? '' : 's'} · ${noteCount} existing note${noteCount === 1 ? '' : 's'}</div>`;",
              "  qs('dayPostPreview').innerHTML = `<div style=\"font-size:12px;color:var(--subtle);margin-bottom:8px;\">${dayPosts.length} post${dayPosts.length === 1 ? '' : 's'} · ${noteCount} existing note${noteCount === 1 ? '' : 's'}</div>`;",
              'note modal planner count'
          )

          js = replace_once(
              js,
              "  state.scheduled.forEach(p => { const k = fmtDate(new Date(p.dueAt)); if (!map[k]) map[k] = { posts: [], notes: [] }; map[k].posts.push(p); });",
              "  getPlannerPosts().forEach(p => { const k = fmtDate(getPostPlanningAt(p)); if (!k) return; if (!map[k]) map[k] = { posts: [], notes: [] }; map[k].posts.push(p); });",
              'agenda planner posts'
          )
          js = replace_once(
              js,
              "    posts.slice(0, 2).forEach(p => { html += `<button type=\"button\" class=\"day-post-preview-btn\" data-agenda-post=\"${key}\">${safeText(compact(p.text, 80))}</button>`; });",
              "    posts.slice(0, 2).forEach(p => { const published = isPublishedPost(p); html += `<button type=\"button\" class=\"day-post-preview-btn${published ? ' is-published' : ''}\" data-agenda-post=\"${key}\">${published ? '✓ ' : ''}${safeText(compact(p.text, 80))}</button>`; });",
              'agenda published styling'
          )
          js = replace_once(js, "<div class=\"empty-title\">Nothing scheduled</div><div class=\"empty-desc\">Connect Buffer and sync to load your upcoming posts.</div>", "<div class=\"empty-title\">Nothing planned</div><div class=\"empty-desc\">Connect Buffer and sync to load published and upcoming posts.</div>", 'agenda empty copy')

          js = replace_once(js, "  const posts = state.scheduled.filter(p => inRange(p.dueAt));", "  const posts = getPlannerPosts().filter(p => inRange(getPostPlanningAt(p)));", 'snapshot planner posts')
          js = replace_once(js, "postCount: state.scheduled.length", "postCount: getPlannerPosts().length", 'snapshot analytics count')

          js = sub_once(
              js,
              r"function postDetailCardsHtml\(posts\) \{.*?\n\}\nfunction noteCardsHtml",
              """function postDetailCardsHtml(posts) {
  return posts.map((p, idx) => {
    const platform = postPlatformLabel(p) || postChannelLabel(p);
    const channel = postChannelLabel(p);
    const published = isPublishedPost(p);
    const statusLabel = published ? 'Published' : 'Scheduled';
    const externalLink = toSafeExternalUrl(p.externalLink);
    return `<div class=\"snap-modal-post${published ? ' is-published' : ''}\">
      <div class=\"snap-modal-post-hdr\">
        <div class=\"snap-modal-post-meta\">
          <span class=\"snap-post-num\">Post ${idx + 1}</span>
          ${platform ? '<span class=\"snap-platform-badge\">' + safeText(platform) + '</span>' : ''}
          ${channel && channel !== platform ? '<span class=\"snap-platform-badge\">' + safeText(channel) + '</span>' : ''}
          <span class=\"snap-platform-badge${published ? ' is-published' : ''}\">${statusLabel}</span>
        </div>
        <span class=\"snap-scheduled-time\">${safeText(formatDateTime(getPostPlanningAt(p)))}</span>
      </div>
      <div class=\"snap-modal-post-body\">${safeText(p.text || '(no copy)')}</div>
      ${mediaPreviewHtml(p)}
      <div class=\"snap-modal-post-copy\">
        <button class=\"btn sm ghost\" data-copy=\"${safeText(p.text || '')}\">Copy post</button>
        ${externalLink ? `<a class=\"btn sm ghost\" href=\"${safeText(externalLink)}\" target=\"_blank\" rel=\"noopener\">View post ↗</a>` : ''}
      </div>
    </div>`;
  }).join('');
}
function noteCardsHtml""",
              'published post details',
              flags=re.S
          )

          js = js.replace("${posts.length} Scheduled post${posts.length > 1 ? 's' : ''}", "${posts.length} Post${posts.length > 1 ? 's' : ''}")
          js = js.replace("No post scheduled", "No post on this day")
          js = js.replace("This day does not have a scheduled post in this calendar.", "This day does not have a published or scheduled post in this calendar.")

          js = replace_once(
              js,
              "    data.posts.slice(0,2).forEach(post => { inner += '<div class=\"day-post-pill\">' + safeText((post.text||'').slice(0,60)) + '</div>'; });",
              "    data.posts.slice(0,2).forEach(post => { const published = isPublishedPost(post); inner += '<div class=\"day-post-pill' + (published ? ' is-published' : '') + '\">' + (published ? '✓ ' : '') + safeText((post.text||'').slice(0,60)) + '</div>'; });",
              'shared calendar published styling'
          )

          js = replace_once(
              js,
              "      if (countEl.parentElement) countEl.parentElement.innerHTML = '<strong id=\"sharedPostCount\">' + posts.length + '</strong> scheduled post' + (posts.length === 1 ? '' : 's');",
              "      if (countEl.parentElement) countEl.parentElement.innerHTML = '<strong id=\"sharedPostCount\">' + posts.length + '</strong> post' + (posts.length === 1 ? '' : 's');",
              'shared post count label'
          )
          js = replace_once(
              js,
              "    posts.forEach(p => { const k = String(p.dueAt || '').slice(0,10); if (!k) return; if (!map[k]) map[k]={posts:[],notes:[]}; map[k].posts.push(p); });",
              "    posts.forEach(p => { const k = p.dateKey || fmtDate(p.dueAt); if (!k) return; if (!map[k]) map[k]={posts:[],notes:[]}; map[k].posts.push(p); });",
              'shared snapshot local date map'
          )

          app.write_text(js)

          css_path = Path('app.css')
          css = css_path.read_text()
          marker = '/* Complete Week: published planner states */'
          if marker not in css:
              css += """

/* Complete Week: published planner states */
.day-post-pill.is-published {
  background: var(--green-dim);
  border-color: rgba(15,166,114,.24);
  color: var(--muted);
  opacity: .9;
}
.day-post-pill.is-published:hover,
.day-post-pill.is-published:focus-visible {
  background: var(--green-dim);
  border-color: var(--green);
  opacity: 1;
}
.day-post-status {
  flex: 0 0 auto;
  font: 700 10px/1 'DM Mono', monospace;
  color: var(--brand);
}
.day-post-pill.is-published .day-post-status { color: var(--green); }
.day-post-preview-btn.is-published {
  background: var(--green-dim);
  border-color: rgba(15,166,114,.24);
  color: var(--green);
}
.snap-modal-post.is-published { border-color: rgba(15,166,114,.24); }
.snap-platform-badge.is-published {
  background: var(--green-dim);
  border-color: rgba(15,166,114,.24);
  color: var(--green);
}
"""
          css_path.write_text(css)

          html_path = Path('app.html')
          html = html_path.read_text()
          html = replace_once(html, '<span class="share-modal-stat-label">Scheduled posts</span>', '<span class="share-modal-stat-label">Posts in range</span>', 'snapshot stat label')
          html = replace_once(html, 'This range has no scheduled posts yet. The snapshot will still show any included planning notes.', 'This range has no posts yet. The snapshot will still show any included planning notes.', 'snapshot empty copy')
          html_path.write_text(html)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = replace_once(
              readme,
              'Monthly calendar view of your Buffer queue. Queue gaps surface automatically so you always know where the holes are.',
              'Monthly and weekly calendar views of your Buffer activity, combining recently published posts with the upcoming queue. Queue gaps surface automatically so you always know where the holes are.',
              'README planner description'
          )
          readme = replace_once(readme, '- PostIQ loads your channels and scheduled queue', '- PostIQ loads your channels, scheduled queue, and recent published posts', 'README Buffer sync description')
          readme_path.write_text(readme)
          PY

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css app.html README.md
          git commit -m "show published posts in planning"
          git push origin HEAD:agent/show-published-posts-in-planning
